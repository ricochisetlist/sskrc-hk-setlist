<!doctype html>
<html lang="en">
<head>

  <title>佐々木李子「香港・李好」香港ファンミーティング | Setlists</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      --cover-art: url("cover_temp.jpg"),
        radial-gradient(circle at 57% 49%, #302333 0 1%, #f9aa8d 1.2% 8%,
          #342b3d 8.3% 15%, #4c4052 15.2% 15.6%, #342b3d 16% 25%,
          #544858 25.2% 25.6%, #332a39 26% 33%, transparent 33.3%),
        linear-gradient(140deg, #ffa88c, #cdaac5 55%, #a99fdc);
      --logo-width: 132px;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      background: #302b37;
      color: #272330;
      font-family: "DM Sans", system-ui, sans-serif;
      line-height: 1.5;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -60px;
      z-index: -1;
      pointer-events: none;
      background-image: var(--cover-art);
      background-size: cover;
      background-position: center;
      filter: blur(30px) brightness(0.65);
    }

    main {
      width: min(100%, 390px);
      margin: 0 auto;
      background: #fff;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 12px 48px #17111e45;
    }

    .cover {
      display: block;
      aspect-ratio: 1;
      background-image: var(--cover-art);
      background-size: cover;
      background-position: center;
    }

    header, .show-heading, footer { text-align: center; }
    header { padding: 22px 12px 18px; }
    h1, h2, p { margin: 0; }
    h1 { font-size: 1.35rem; }
    header p { margin-top: 4px; color: #514c57; }
    .show-heading { padding: 12px; background: #f5f2f5; }
    h2 { font-size: 1.05rem; }
    .show-heading p { font-size: 0.88rem; color: #514c57; }

    .service {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 0 20px;
      border-bottom: 1px solid #eeeaf0;
      color: inherit;
      text-decoration: none;
    }

    .logo {
      display: flex;
      align-items: center;
      width: min(100%, var(--logo-width));
      height: 44px;
      overflow: hidden;
      font-weight: 600;
    }

    .logo img {
      display: block;
      width: 100%;
      height: 38px;
      object-fit: contain;
      object-position: left center;
    }

    .logo.amazon img {
      flex: none;
      width: 119%;
      height: auto;
      transform: translateX(-8%);
    }

    .listen {
      padding: 5px 13px;
      border: 1px solid #cbc5cf;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .listen:hover {
      color: white;
      background: #342c3d;
      border-color: #342c3d;
    }
    .service:focus-visible { outline: 3px solid #795390; outline-offset: -3px; }

    footer {
      padding: 18px 16px;
      color: #5f5964;
      font-size: 0.78rem;
    }
  </style>
</head>
